name: Shared Memory PostgreSQL Tests

on:
  push:
    branches:
      - feature/shared-memory-v0.3.7.9-20260915
    paths:
      - ".github/workflows/shared-memory-postgres.yml"
      - "server/**"
      - "mcp/**"
      - "docs/shared-memory-railway.zh-CN.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/feature/shared-memory-v0.3.7.9-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memory_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: memory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_ci -d memory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_DATABASE_URL: postgresql://memory_ci:ci-only-password@127.0.0.1:5432/memory_ci
      MEMORY_ENABLED: "false"
      MEMORY_MCP_TOOLS_ENABLED: "false"
      MEMORY_CREDENTIAL_PEPPER: ci-only-pepper
      MEMORY_BOOTSTRAP_READER_TOKEN: ci-only-reader-token
      MEMORY_BOOTSTRAP_WRITER_TOKEN: ci-only-writer-token

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s server/tests -p "test_memory_api.py" -v
          python -m unittest discover -s server/tests -p "test_memory_hardening.py" -v
          python -m unittest discover -s server/tests -p "test_memory_static.py" -v
          python -m unittest discover -s server/tests -p "test_memory_store.py" -v

      - name: Run five real PostgreSQL integration tests
        run: python -m unittest discover -s server/tests -p "test_memory_postgres_integration.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install MCP dependencies
        run: npm install --prefix mcp --ignore-scripts --no-audit --no-fund

      - name: Run MCP tests
        run: npm test --prefix mcp

      - name: Check source syntax
        run: |
          python -m compileall -q server
          node --check mcp/server.js
          node --check mcp/memory-safety.js
          node --check mcp/memory-tools.js
